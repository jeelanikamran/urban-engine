<!DOCTYPE html>
<html>

<head>
    <title>Expense Tracker</title>
</head>

<body>

    <h1>Expense Tracker</h1>

    <!-- Input fields for expense details -->
    <input type="text" id="name" placeholder="Expense Name">

    <input type="text" id="amount" placeholder="Expense Amount">

    <!-- Dropdown for selecting expense category -->
    <select id="eCat">
        <option>Food</option>
        <option>Shopping</option>
        <option>Travel</option>
        <option>Education</option>
    </select>

    <!-- Button to add the expense -->
    <button onclick="addit()">ADD</button>

    <h3>My Expenses</h3>

    <!-- The expense table will be displayed here -->
    <div id="wrapper"></div>

    <!-- Total expense will be displayed here later -->
    <div id="total"></div>


    <script>

        // Get the saved expense list from localStorage
        let expenselist = localStorage.getItem("expenselist");

        // Convert the JSON string back into a JavaScript array
        expenselist = JSON.parse(expenselist);


        // If there is no saved expense list,
        // create an empty array
        if (expenselist == null) {
            expenselist = [];
        }
        else {
            // If saved expenses exist,
            // display them when the page loads
            display();
        }


        // Function to add a new expense
        function addit() {

            // Get values entered by the user
            let name = document.getElementById("name").value;
            let amount = document.getElementById("amount").value;
            let category = document.getElementById("eCat").value;


            // Create an object containing the expense details
            let obj = {
                expensename: name,
                expenseamount: amount,
                category: category
            };


            // Add the new expense object to the array
            expenselist.push(obj);


            // Convert the array into a JSON string
            // and save it in localStorage
            localStorage.setItem(
                "expenselist",
                JSON.stringify(expenselist)
            );


            display(); // Display the updated expense list

        }


        function display() { // Function to display all expenses


            let temp = ""; // Temporary string that will contain our HTML



            temp += `
                <table border="1">

                    <tr>
                        <th>Name</th>
                        <th>Amount</th>
                        <th>Category</th>
                    </tr>
            `;


            expenselist.forEach((e) => { // Loop through every expense in the array


                temp += `
                    <tr>
                        <td>${e.expensename}</td>
                        <td>${e.expenseamount}</td>
                        <td>${e.category}</td>
                    </tr>
                `;

            });

            temp += `</table>`;


            document.getElementById("wrapper").innerHTML = temp; // Put the generated HTML inside the wrapper div

        }

    </script>

</body>

</html>
