<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
</head>
<body>
        <h1>Password Generator</h1>
        <input type="text" id="passlength" placeholder="Enter Length of Password">
<button onclick="gen()">Submit</button>
        <p id="passvalue"></p>
</body>
</html>
<script>
    function gen(){
            Cap = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            Small = 'abcdefghijklmnopqrstuvwxyz';
            Digits = '0123456789';
            Special_Characters = '@#$%^&*()!-_+=?/><|';

            str = '';
            str+=Cap;
            str+=Small;
            str+=Digits;
            str+=Special_Characters;

            len = str.length;


            pass = '';

            passLength = document.getElementById('passlength').value;

            for(i=0; i < passLength; i++)
            {
                x = Math.random();
                x = x*len;
                x = Math.floor(x);
                pass += str[x];
            }
                document.getElementById('passvalue').innerText=pass;
    }
</script>
