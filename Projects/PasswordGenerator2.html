<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
</head>
<body>
        <h1>Password Generator</h1>

<!-- div starts -->
        <div>
            <label>Capital Letter:</label><input type="checkbox" class = 'everychr' >
            <br>
             <label>Small Letter:</label><input type="checkbox" class = 'everychr' checked>
            <br>
             <label>Digits:</label><input type="checkbox" class = 'everychr' >
            <br>
             <label>Special_Characters:</label><input type="checkbox" class = 'everychr' >
            <br>
        </div>
<!-- div ends -->
        <hr>
        <input type="text" id="passlength" placeholder="Enter Length of Password" required>
<button onclick="gen()">Submit</button>
        <p id="passvalue"></p>
</body>
</html>
<script>
    function gen(){
            Cap = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            Small = 'abcdefghijklmnopqrstuvwxyz';
            Digits = '0123456789';
            Special_Characters = '@#$%^&*()!-_+=?/><|';

            chr = document.getElementsByClassName('everychr');

            str ='';
            if(chr[0].checked)
            {
                str+=Cap;
            }

             if(chr[1].checked)
            {
                str+=Small;
            }

            if(chr[2].checked)
            {
                str+=Digits;
            }

            if(chr[3].checked)
            {
                str+=Special_Characters;
            }

            len = str.length;


            pass = '';

            passLength = document.getElementById('passlength').value;

            for(i=0; i < passLength; i++)
            {
                x = Math.random();
                x = x*len;
                x = Math.floor(x);
                pass += str[x];
            }
                document.getElementById('passvalue').innerText=pass;
    }
</script>
