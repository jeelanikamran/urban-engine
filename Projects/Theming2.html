<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <title>Dark and White Theme</title>
</head>
<body onload="defaultTheme()">

    <div id="platter">
        <h1>Hello World!!!</h1>
    </div>

        <button onclick="setTheme()"><i class="fa-solid fa-circle-half-stroke"></i></button>

</body>
</html>
<script>
    // let isDark =true;
    function defaultTheme()
    {
        document.getElementById("platter").setAttribute('class','btnlight');
        isDark = false;
    }

   function setTheme() {
    if (isDark === false) {
        document.getElementById("platter").setAttribute('class', 'btndark');
        isDark = true;
    } else {
        document.getElementById("platter").setAttribute('class', 'btnlight');
        isDark = false;
    }
}


</script>
<style>
  *
  {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
.btnlight
{
    background-color: whitesmoke;
    color: black;
    padding: 14px;
    /* font-size:medium; */
    /* text-align:center; */
}
.btndark
{
    background-color: black;
    color: whitesmoke;
    padding: 14px;
    /* font-size:medium; */
    /* text-align: center; */
}
button
{
    width: 30px;
    height: 23px;
    margin-top: 10px;
    margin-left: 500px;
}
</style>
