<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theme Settings</title>
</head>
<body>
            <h1>Themes</h1>

    <div class="bothSides left">
            <h2>Settings</h2>
                <h3>Question Settings</h3> <br>

                <label>Colour</label>
                <input type="text" id="colorQ" placeholder="QColor" onkeyup="setQcolor()">
                <br><br>
                <label>Alignment</label>
                <select id="alignQ" onchange="setQalign()">
                    <option>left</option>
                      <option>center</option>
                      <option>right</option>
                </select>
                <br><br>
                <label>Font Size</label>
                <select id="fontQ" onchange="setQfont()">
                    <option>10px</option>
                      <option>14px</option>
                      <option>18px</option>
                      <option>22px</option>
                      <option>24px</option>
                      <option>28px</option>
                      <option>30px</option>
                </select>
    </div>


    <div class = 'bothSides right'>
        <h3>Answer Settings</h3>

        <h4 id="title">What IS JavaScript ?</h4>

        <input type="text" placeholder="Answer Here: " id="answer">

        <br><br>

        <button id="btn">Submit</button>

    </div>
</body>
</html>

<style>
    *
    {
        padding: 0px;
        margin: 0px;
    }
    h1
    {
        text-align: center;
        padding: 10px;
        background-color:black;
        color: antiquewhite;
    }
    .bothSides
    {
        display: inline-block;
        width: 40%;
        padding:20px;
        vertical-align: top;
    }
    h2
    {
        text-align: center;
    }
    .left
    {
        background-color: whitesmoke;
    }
</style>
