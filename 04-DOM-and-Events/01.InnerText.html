<!-- Utilising InnerText -->
<html>
    <head>
        <title>
            Display Numbers in HTML
        </title>
    </head>

        <body>
                <h1>
                    Display:  (1 to 5)
                </h1>

                <div id = 'result'>
                    Numbers : <br>
                </div>
        </body>
</html>

<script>
    for(x =1; x<=5; x++)
{
    document.getElementById('result').innerText+=x;

}
</script>
