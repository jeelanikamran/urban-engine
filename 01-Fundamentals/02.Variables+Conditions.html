<!-- # 2.Swap Two Numbers without Using a Third Variable: -->
<script>
    x = 10;
    y = 20;
document.write('Before Swap: x was ' + x + ' and Y was ' + y + '<br>')
    x = y + x;
    y = x - y;
    x = x - y;
document.write('After Swap: x is ' + x + ' and Y is ' + y)

 </script>

<script>
    x = 5;

    for(i = 0; x>0;x--)
 {

 }
     document.write(f)

 </script>

<!-- 9. 0 1 1 2 3 5 [Fibonachii Series]:-->
<script>
x = 0;
// initial value
f = 1;
// second value
fib = 0;
// stores sum of both
for(i =0; i<=10; i++)
{
    document.write(x+'<br>');
    fib = x+f;
    x = f;
    f = fib;

}
</script>

<!-- 10. 0,1,1,2,4,7 [Tribonacci-style sequence]: -->
<script>
    x = 0;
    y = 1;
    z = 1;
    store = 0;
    for(i = 0;i<=10;i++)
 {
    document.write(x+'<br>')
    store = x+y+z;
    x = y
    y = z;
    z = store;

 }
 </script>

<!-- 11. Sum of digits: -->
<script>
x = [1,2,3,4,5,6];
sum = 0;
for(i = 0; i<x.length; i++)
{
    sum = sum+x[i];
}
    document.write(sum);
</script>

<!-- 12. Reverse of a Number: -->
<script>
    x = [1, 2, 3];

for (i = 0; i < x.length; i++)
{
    document.write(x[i]); //prints 1,2,3
}

document.write('<br>');

for (i = x.length - 1; i >= 0; i--)
{
    document.write(x[i]); //prints reverse of the array 3,2,1
}
</script>
