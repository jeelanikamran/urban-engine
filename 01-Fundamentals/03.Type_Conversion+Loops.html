<!-- 02.Even Odd [we can use (/ & *) or (/ & +) to find even odd]-->

<script>
    x = prompt("Enter A Number: ");
    x = parseInt(x);

    y = parseInt(x/2);
    y = y * 2;

    if(x == y)
{
    alert(x + ' is Even!!');
}
else
{
    alert(x + ' is Odd!!');
}
// we could have used (x % 2 == 0), Same thing.
</script>

 -->

 <script>
    x = 1;

 {

    document.write(x + '<br>')

 }
 </script>

<!-- 03A. Do While Loop -->
 <script>
x = 1;
do
{
    document.write(x + '<br>');
    x++;
}
while(x<5);

 </script>

<!-- while: check → execute → check → execute

do...while: execute → check → execute → check -->
