<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/css/bootstrap.min.css"
    />
    <title>Dynamic HTML + APi Fetch()</title>
  </head>
  <!-- Using HTML event handler [loadData()] -->
  <body onload="loadData()">

    <h1>User List</h1>
    <!--The Data we get from API gets displayed here  -->
    <div id="wrapper"></div>
  </body>
</html>

<script>
  async function loadData() {
    data = await fetch("https://jsonplaceholder.typicode.com/users"); // fetching data via API storing it in [data] variable.
    users = await data.json(); //the whole data get's parsed into JS and stored in [users] variable.

    console.log(users);

    // function call--
    displayData(users);
  }

  function displayData(users) {
    temp = ``;
    temp += `<table class = 'table table-striped'>
        <tr>
            <th>ID</th>
                <th>Name</th>
                    <th>UserName</th>
                        <th>Email</th>
        </tr>`;

    users.forEach((u) => {
      temp += `<tr>
            <td>${u.id}</td>
                <td>${u.name}</td>
                    <td>${u.username}</td>
                        <td>${u.email}</td>
        </tr>`;
    });

    temp += `</table>`;

    document.getElementById("wrapper").innerHTML = temp;
  }
</script>
