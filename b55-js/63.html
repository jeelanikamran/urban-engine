     <h3>add New attributes</h3>
	<input type="text"  placeholder="Enter No. of attributes" id="attrno"> <button onclick="addnewatt()"> Add</button>

<script type="text/javascript">
	function addnewatt()
	{
           n= document.getElementById("attrno").value;

           temp=''

           for(i=0;i<n; i++)
           {
               temp+="<input type='text' placeholder='Attribute name'/> <input type='text' placeholder='Attribute value'/>  <br>";

           }

           document.getElementById("wrapper").innerHTML=temp;
	}
</script>
