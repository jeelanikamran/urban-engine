<!DOCTYPE html>
<html>
<head>
	<title></title>
</head>
<body>
	<input type="text" id="price" placeholder="Price" onkeyup="fun()">
	<br>

	<input type="text" id="quantity" placeholder="quantity" onkeyup="fun()">
	<br>

	<input type="text" id="total" placeholder="total">
	<br>

</body>
</html>


<script type="text/javascript">

	function fun()
	{
		p=document.getElementById("price").value;
		q=document.getElementById("quantity").value;
		t=p*q;

		document.getElementById("total").value=t;

	}
	
</script>
