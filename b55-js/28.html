<script type="text/javascript">

	function sum() // called funtion 
	{
		x=10;
		y=20;
		z=x+y;
		document.write("sum is" +z);
	}

	function sub() // called funtion 
	{
		x=10;
		y=20;
		z=x-y;
		document.write("<br>sub is "+ z);
	}


	sum();  // calling function

	sub();
	

</script>
