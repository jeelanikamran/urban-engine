<!DOCTYPE html>
<html>
<head>
	<title></title>
</head>
<body>
	<h1>User List</h1>

	<div id="wrapper">
		
	</div>

</body>
</html>

<script type="text/javascript">
	
	users=[
     {id:1, name:"amir", class:'bca', result:'pass'},
     {id:2, name:"aqsa", class:'bca', result:'fail'},
     {id:3, name:"babar", class:'mca', result:'pass'},
     {id:4, name:"mehak", class:'bca', result:'pass'},

	]

	temp=``;
   temp+=` <table>
              <tr> 
               <th> id </th>
               <th> name</th>
               <th>  class </th>
               <th> result </th>
               </tr>

               `;

  


  users.forEach((u)=>{
     temp+=`<tr>

         <td> ${u.id} </td>
         <td> ${u.name} </td>
         <td> ${u.class} </td>
         <td> ${u.result} </td>`;

           if(u.result=='pass')
           {
             temp+=`<td> tick </td>`;
           }
           else
           {
              temp+=`<td> cross </td>`;
           }

         temp+=`</tr>
     `;
	   



  })

   temp+=`</table>`;

   document.getElementById("wrapper").innerHTML=temp



</script>
