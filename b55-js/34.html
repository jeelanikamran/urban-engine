<!DOCTYPE html>
<html>
<head>
	<title>	</title>
</head>
<body>

	<div id="header">kashmir</div>

	<br>

	<button onclick="fun1()"> add color</button>
	<button onclick="fun2()"> add bg color</button>

	<button onclick="fun3()"> add padding</button>


</body>
</html>

<script type="text/javascript">
	function fun1()
	{
		document.getElementById("header").style.color="red";
	}
	function fun2()
	{
		document.getElementById("header").style.backgroundColor="black";
	}

	function fun3()
	{
		document.getElementById("header").style.padding="20px";
	}
</script>
