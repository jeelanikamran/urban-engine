<!-- constructor: is a method that is used to intialize the object, it is called automaticcaly whn object is created -->


<script type="text/javascript">
	class Employee
	{
		id;
		name;

		constructor(x, y)
		{
            this.id=x
            this.name=y
		}


	}

	obj= new Employee(1,'amir'); // call constructor

	obj2= new Employee(2,'aqsa');

	console.log(obj)
	console.log(obj2)
</script>
