<!DOCTYPE html>
<html>
<head>
	<title></title>
</head>
<body>

	<div id="clock"></div>

</body>
</html>

<script type="text/javascript">

  setInterval(fun, 1000);


  function fun()
  {
  	d= new Date();
	temp=d.toLocaleTimeString();
	document.getElementById("clock").innerText=temp
  }

	
</script>

<style type="text/css">
	#clock 
	{
		background-color: black;
		color: white;
		padding: 30px;
		font-size: 20px;

	}
</style>
