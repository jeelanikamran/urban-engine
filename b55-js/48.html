<!DOCTYPE html>
<html>
<head>
	<title></title>
</head>
<body>
	 <img src="bg.jpg" id="bigimg">

	 <br>
	 <img src="bg.jpg" class="smallimages" onclick="changeimg(0)">

	  <img src="1.jpg" class="smallimages" onclick="changeimg(1)">

	   <img src="2.jpg" class="smallimages" onclick="changeimg(2)">
	   <img src="3.jpg" class="smallimages" onclick="changeimg(3)">

     


</body>
</html>

<script type="text/javascript">
	function changeimg(i)
	{
		alert(i)
		arr=document.getElementsByClassName("smallimages");


		document.getElementById("bigimg").src=arr[i].src;
	}
</script>

<style type="text/css">
	#bigimg 
	{
		width: 500px;
		height: 500px;
		margin: 40px;
	}
	.smallimages
	{
		width: 50px;
		height: 50px;
	}
</style>
