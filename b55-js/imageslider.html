<!DOCTYPE html>
<html>
<head>
	<title></title>
</head>
<body>

	<img src="bg.jpg" id="bigimg">

	<br>

	<button onclick="preimg()">Pre</button>
	<button  onclick="nxtimg()">Nxt</button>

	<br>

	<img src="bg.jpg" class="smallimages" onclick="fun(0)">
	<img src="3.jpg" class="smallimages" onclick="fun(1)">
	<img src="1.jpg" class="smallimages" onclick="fun(2)">
	<img src="2.jpg" class="smallimages" onclick="fun(3)">

</body>
</html>

<script type="text/javascript">

	selectedindex=0;



	function fun(i)
	{
		arr=document.getElementsByClassName('smallimages');

		document.getElementById("bigimg").src=arr[i].src;

		selectedindex=i;

	}
	function nxtimg()
	{
           arr=document.getElementsByClassName('smallimages');
		  if(selectedindex== arr.length-1)
		  {
		  	selectedindex=0;
		  }
		  else
		  {
		  	selectedindex++;
		  }
		
		fun(selectedindex)

	}

	function preimg()
	{
		arr=document.getElementsByClassName('smallimages');
		  if(selectedindex==0)
		  {
		  	selectedindex= arr.length-1;
		  }
		  else
		  {
		  	selectedindex--;
		  }
		
		fun(selectedindex)

	}
</script>


<style type="text/css">
	#bigimg 
	{
		width: 300px;
		height: 300px;
		margin: 50px;
	}
	.smallimages
	{
		width: 50px;
		height: 50px;
		cursor: pointer;
	}
</style>
