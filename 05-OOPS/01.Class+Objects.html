 Class consists of two main things:
    - Methods. eg: eats(), sleeps(), kills().
    - Attributes. eg: name, age, gender, color
    -->

<!--
    We use [class] keyword to create a class

    eg:

    class humans
    {
        name
        color
        gender
        age
    };

    obj = new humans() -> here we craeted an object for this class.

    obj.name = "Kamran";
    obj.color = 'White';
    obj.gender = 'Male';
    obj.age = 25;       -> These objects are made via the dot [.] operator.
-->
