<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pagination 2</title>

    <style>
      .active {
        background-color: blue;
        color: white;
      }
    </style>
  </head>

  <body>
    <div id="userWrapper"></div>`
    <div id="pageWrapper"></div>

    <script>
      const users = [
        { id: 1, name: "Kamran", age: 25 },
        { id: 2, name: "Ahsaan", age: 24 },
        { id: 3, name: "Abuzar", age: 25 },
        { id: 4, name: "Junaid", age: 20 },
        { id: 5, name: "Afeef",  age: 21 },
        { id: 6, name: "Hamza",  age: 19 },
        { id: 7, name: "Zaydu",  age: 27 },
        { id: 8, name: "Hazik",  age: 23 },
      ];

      let currentPage = 1;
      const perPage = 3;

      const totalUsers = users.length;
      const totalPages = Math.ceil(totalUsers / perPage);

      // Main function to change pages
      function changePage(pageNumber) {
        currentPage = pageNumber;

        generateButtons();

        const start = (currentPage - 1) * perPage;
        const end = currentPage * perPage;

        const currentUsers = users.slice(start, end);

        let userHTML = "";

        currentUsers.forEach((u) => {
          userHTML += `
                    <p>
                        ID: ${u.id}<br>
                        Name: ${u.name}<br>
                        Age: ${u.age}
                    </p>
                    <hr>
                `;
        });

        document.getElementById("userWrapper").innerHTML = userHTML;

        // console.log(currentUsers);
      }

      // Function to generate pagination buttons
      function generateButtons() {
        let temp = "";

        temp += `<button onclick="pre()">Previous</button>`;

        for (let i = 1; i <= totalPages; i++) {
          temp += `
                    <button
                        class="${currentPage === i ? "active" : ""}"
// iternary operator ?
                        onclick="changePage(${i})">
                        ${i}
                    </button>
                `;
        }

        temp += `<button onclick="next()">Next</button>`;

        document.getElementById("pageWrapper").innerHTML = temp;
      }

      // Previous page
      function pre() {
        if (currentPage > 1) {
          changePage(currentPage - 1);
        }
      }

      // Next page
      function next() {
        if (currentPage < totalPages) {
          changePage(currentPage + 1);
        }
      }

      // Load the first page automatically
      changePage(1);
    </script>
  </body>
</html>
